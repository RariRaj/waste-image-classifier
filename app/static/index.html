<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waste Image Classifier</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6f4;
      color: #18352b;
      margin: 0;
      padding: 24px;
    }

    main {
      max-width: 620px;
      margin: 30px auto;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px #0000000d;
    }

    h1 { margin-top: 0; }
    p { line-height: 1.5; }

    input, button {
      display: block;
      margin-top: 16px;
    }

    button {
      background: #166b46;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #preview {
      display: block;
      max-width: 100%;
      max-height: 300px;
      margin: 20px auto;
      border-radius: 8px;
      object-fit: contain;
    }

    [hidden] { display: none !important; }
    #message { min-height: 24px; }
    .error { color: #b42318; }
    .note { color: #59685f; font-size: 14px; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid #e3ebe6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Waste Image Classifier</h1>
    <p>
      Upload a photo of cardboard, glass, metal, paper,
      plastic, or trash.
    </p>

    <form id="upload-form">
      <label for="image-file">Choose an image</label>
      <input
        id="image-file"
        name="file"
        type="file"
        accept="image/jpeg,image/png"
        required
      >
      <p class="note">JPEG or PNG · Maximum file size: 5 MiB</p>

      <img id="preview" alt="Selected image preview" hidden>

      <button id="classify-button" type="submit" disabled>
        Classify image
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <section id="result" hidden>
      <h2 id="prediction"></h2>
      <p id="confidence"></p>

      <table>
        <thead>
          <tr><th>Category</th><th>Model score</th></tr>
        </thead>
        <tbody id="scores"></tbody>
      </table>
    </section>

    <p class="note">
      Predictions can be incorrect, even with a high model score.
      This model always chooses one of its six categories.
    </p>
    <p><a href="/docs">API documentation</a></p>
  </main>

  <script>
    const form = document.getElementById("upload-form");
    const input = document.getElementById("image-file");
    const button = document.getElementById("classify-button");
    const preview = document.getElementById("preview");
    const message = document.getElementById("message");
    const result = document.getElementById("result");
    const prediction = document.getElementById("prediction");
    const confidence = document.getElementById("confidence");
    const scores = document.getElementById("scores");

    const maxBytes = 5 * 1024 * 1024;
    let previewUrl = null;

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.className = isError ? "error" : "";
    }

    input.addEventListener("change", () => {
      result.hidden = true;
      preview.hidden = true;
      preview.removeAttribute("src");
      button.disabled = true;
      showMessage("");

      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }

      const file = input.files[0];
      if (!file) return;

      if (file.size === 0) {
        showMessage("Please choose a non-empty image.", true);
        return;
      }

      if (file.size > maxBytes) {
        showMessage("The image exceeds the 5 MiB limit.", true);
        return;
      }

      // The API performs authoritative image-format validation.
      previewUrl = URL.createObjectURL(file);
      preview.src = previewUrl;
      preview.hidden = false;
      button.disabled = false;
    });

    preview.addEventListener("error", () => {
      preview.hidden = true;
      showMessage(
        "Preview unavailable. The server will validate the upload."
      );
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const file = input.files[0];
      if (!file || button.disabled) return;

      const formData = new FormData();
      formData.append("file", file);

      button.disabled = true;
      input.disabled = true;
      result.hidden = true;
      showMessage("Classifying your image…");

      try {
        const response = await fetch("/predict", {
          method: "POST",
          body: formData,
        });

        const data = await response.json().catch(() => null);

        if (!response.ok) {
          const detail =
            typeof data?.detail === "string"
              ? data.detail
              : `Request failed (${response.status}). Please try again.`;
          throw new Error(detail);
        }

        if (
          !data ||
          typeof data.predicted_class !== "string" ||
          typeof data.confidence !== "number" ||
          !data.class_scores
        ) {
          throw new Error("The server returned an unexpected response.");
        }

        prediction.textContent = `Prediction: ${data.predicted_class}`;
        confidence.textContent =
          `Top model score: ${(data.confidence * 100).toFixed(2)}%`;

        scores.replaceChildren();

        const sortedScores = Object.entries(data.class_scores)
          .sort((a, b) => b[1] - a[1]);

        for (const [category, score] of sortedScores) {
          const row = document.createElement("tr");
          const nameCell = document.createElement("td");
          const scoreCell = document.createElement("td");

          nameCell.textContent = category;
          scoreCell.textContent = `${(score * 100).toFixed(2)}%`;

          row.append(nameCell, scoreCell);
          scores.append(row);
        }

        result.hidden = false;
        showMessage("Prediction complete.");
      } catch (error) {
        showMessage(
          error instanceof TypeError
            ? "Could not reach the API. Check that the server is running."
            : error.message,
          true
        );
      } finally {
        button.disabled = false;
        input.disabled = false;
      }
    });
  </script>
</body>
</html>
